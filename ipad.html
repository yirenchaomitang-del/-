<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>时间感知助手 · iPad</title>
<style>
:root{
  --bg:#f4f1ea;
  --panel:#ffffffcc;
  --text:#20231f;
  --muted:#767c76;
  --line:#e6e0d6;
  --accent:#2d6e5f;
  --accent-soft:#dfeee8;
  --shadow:0 18px 55px rgba(45,50,45,.08);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
body{transition:background .6s ease,color .6s ease}
.screen{
  width:100vw;height:100vh;
  padding:calc(30px + env(safe-area-inset-top)) calc(36px + env(safe-area-inset-right))
          calc(30px + env(safe-area-inset-bottom)) calc(36px + env(safe-area-inset-left));
  display:grid;grid-template-columns:1.45fr .85fr;gap:28px;
}
.left,.right{min-width:0}
.left{display:flex;flex-direction:column;justify-content:space-between}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.kicker{font-size:14px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.clock{font-size:clamp(92px,13vw,170px);font-weight:820;line-height:.9;letter-spacing:-.06em;
font-variant-numeric:tabular-nums;margin-top:14px}
.date{font-size:20px;color:var(--muted);margin-top:18px}
.daytag{font-size:14px;color:var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:999px;white-space:nowrap}
.main{
  margin-top:22px;
  background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:34px;padding:30px 32px;box-shadow:var(--shadow)
}
.label{font-size:13px;color:var(--accent);font-weight:780;letter-spacing:.08em}
.title{font-size:clamp(34px,4.2vw,58px);font-weight:820;line-height:1.1;letter-spacing:-.035em;margin:12px 0 14px}
.desc{font-size:clamp(16px,1.6vw,22px);line-height:1.7;color:var(--muted);max-width:92%}
.action{
  margin-top:22px;padding:20px 22px;border-radius:22px;background:var(--accent-soft);
}
.action small{display:block;font-size:12px;color:var(--accent);font-weight:780;margin-bottom:7px}
.action b{font-size:clamp(18px,1.8vw,25px);line-height:1.5}
.bottom-progress{margin-top:26px}
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.right{display:flex;flex-direction:column;gap:18px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)
}
.card h3{font-size:14px;color:var(--muted);font-weight:700;margin:0 0 10px}
.big{font-size:34px;font-weight:820;letter-spacing:-.03em}
.sub{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.6}
.nextTitle{font-size:26px;font-weight:800;line-height:1.25;margin-top:4px}
.timeline{flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px}
.item{
  display:grid;grid-template-columns:72px 1fr;gap:12px;padding:13px 14px;border-radius:18px;
  border:1px solid transparent;opacity:.48;transition:.25s ease
}
.item.active{opacity:1;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.item.next{opacity:.82;background:rgba(255,255,255,.42)}
.itime{font-size:13px;font-weight:760;font-variant-numeric:tabular-nums}
.itask{font-size:14px;font-weight:730;line-height:1.4}
.footer-note{font-size:12px;color:var(--muted);text-align:right}
.night{
  --bg:#151817;--panel:#202421d9;--text:#eef2ef;--muted:#a6aea8;--line:#343a36;
  --accent:#86c6b4;--accent-soft:#203a33;--shadow:0 18px 55px rgba(0,0,0,.22)
}
.evening{
  --bg:#eae6df;--panel:#fffaf3cc;--accent:#7a6750;--accent-soft:#eee4d7
}
.morning{
  --bg:#f7f2e7;--accent:#7c6a43;--accent-soft:#efe6d2
}
@media (orientation:portrait){
  html,body{overflow:auto}
  .screen{height:auto;min-height:100vh;grid-template-columns:1fr;overflow:visible}
  .right{display:grid;grid-template-columns:1fr 1fr}
  .timeline{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="screen">
  <section class="left">
    <div>
      <div class="topline">
        <div>
          <div class="kicker">TIME AWARENESS · 时间感知</div>
          <div class="clock" id="clock">--:--</div>
          <div class="date" id="date">正在读取设备时间…</div>
        </div>
        <div class="daytag" id="phaseTag">现在</div>
      </div>

      <section class="main">
        <div class="label">这一刻，只做这件事</div>
        <div class="title" id="title">正在判断当前时间段</div>
        <div class="desc" id="desc">你不需要先计划。页面会直接告诉你现在大致应该做什么。</div>
        <div class="action">
          <small>现在立刻开始</small>
          <b id="action">先看一下现在几点。</b>
        </div>
      </section>
    </div>

    <div class="bottom-progress">
      <div class="progress-head">
        <span>今天已经过去</span>
        <span id="dayPercent">0%</span>
      </div>
      <div class="bar"><span id="dayBar"></span></div>
    </div>
  </section>

  <aside class="right">
    <section class="card">
      <h3>当前时间段</h3>
      <div class="big" id="range">--</div>
      <div class="sub" id="remain">正在计算剩余时间</div>
    </section>

    <section class="card">
      <h3>下一件事</h3>
      <div class="nextTitle" id="nextTask">--</div>
      <div class="sub" id="nextTime">--</div>
    </section>

    <section class="card timeline" id="timeline"></section>

    <div class="footer-note">不补之前错过的时间，只从现在开始。</div>
  </aside>
</main>

<script>
const plan=[
["00:00","08:00","🌙 睡觉","现在不需要充实自己。睡觉就是此刻唯一任务。","放下手机，关灯，去睡。"],
["08:00","08:30","☀️ 起床，让身体醒过来","先把身体启动，不需要马上思考今天要完成什么。","拉窗帘 → 喝水 → 洗漱 → 换衣服。"],
["08:30","09:00","🍳 好好吃早餐","用一顿完整的早餐告诉自己：今天正式开始。","坐下来吃早餐，吃完再看别的。"],
["09:00","10:30","🧠 做一件需要动脑的事","不需要先制定目标，直接推进手头最值得继续的一件正事。","打开电脑，从最近正在做的学习 / 设计 / 工作继续。"],
["10:30","10:50","🫖 离开屏幕休息","人为制造一个时间断点，避免上午变成模糊的一整块。","站起来，喝水，上厕所，走动几分钟。"],
["10:50","12:00","💻 再专注一轮","上午还没有结束，再完成一段完整投入。","继续刚才的事情，不开新的坑。"],
["12:00","13:00","🍚 吃午饭","十二点以后，上午正式结束。","停下手里的事，去吃饭。"],
["13:00","14:00","🛋 午休与放空","允许自己什么都不产出。休息是下午重新开始的分界线。","午睡、躺一会儿或轻松刷一会儿，到点结束。"],
["14:00","15:30","📚 下午第一轮投入","下午重新开机。适合学习、作品、工作或处理重要事务。","选手头最明确的一件事，先做 20 分钟。"],
["15:30","16:00","🍎 加餐 + 走动","不要让下午变成一整块模糊时间。","吃点东西、接水、走动，离开当前座位。"],
["16:00","17:30","✨ 输入与积累","这一段不追求巨大成果，更适合学习新东西、看案例、整理资料。","找一个真正感兴趣的内容，认真看或练习一小段。"],
["17:30","18:00","🧹 收尾，不再开新任务","帮助大脑意识到白天快结束了。","保存文件、关掉无关页面、简单整理桌面。"],
["18:00","19:00","🥣 晚饭","现在的任务不是继续努力，而是吃饭。","离开工作位置，好好吃一顿晚饭。"],
["19:00","20:00","🚶 出门走一走","用天色和身体感受“晚上到了”。","出门散步 20–40 分钟；不方便出门就做轻运动。"],
["20:00","21:30","🎬 放心娱乐","充实不是一直学习。有边界的娱乐也是生活的一部分。","选一种娱乐：电影、剧、游戏或聊天，只选一个。"],
["21:30","22:00","🏠 把生活恢复整洁","通过整理环境告诉自己：今天进入收尾阶段。","收桌面、衣服、垃圾，整理最明显的一处。"],
["22:00","23:00","🚿 洗澡、护肤、慢下来","降低刺激，让身体感知夜晚。","去洗澡、护肤、吹头发，不再开始工作。"],
["23:00","23:30","📖 做一点安静的事","这半小时不追求成长，只让脑子逐渐降速。","听音乐、阅读几页、随便写两句，任选一种。"],
["23:30","24:00","📵 结束今天","每天需要一个清晰的句号，时间才不会全部糊在一起。","把手机放远，准备睡觉。"]
];

function tm(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function pad(n){return String(n).padStart(2,"0")}

function renderTimeline(current){
  const idxs=[current-1,current,current+1,current+2].filter(i=>i>=0&&i<plan.length);
  document.getElementById("timeline").innerHTML=idxs.map(i=>{
    const p=plan[i];
    let cls=i===current?"active":i===current+1?"next":"";
    return `<div class="item ${cls}">
      <div class="itime">${p[0]}</div>
      <div class="itask">${p[2]}</div>
    </div>`;
  }).join("");
}

function update(){
  const n=new Date();
  const h=n.getHours(), min=n.getMinutes(), sec=n.getSeconds();
  const total=h*60+min+sec/60;

  document.getElementById("clock").textContent=`${pad(h)}:${pad(min)}`;
  const days=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  document.getElementById("date").textContent=
    `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 · ${days[n.getDay()]}`;

  let idx=plan.findIndex(p=>total>=tm(p[0]) && total<(p[1]==="24:00"?1440:tm(p[1])));
  if(idx<0) idx=0;
  const p=plan[idx];
  const end=p[1]==="24:00"?1440:tm(p[1]);
  const remain=Math.max(0,end-total);
  const rh=Math.floor(remain/60), rm=Math.floor(remain%60);

  document.getElementById("title").textContent=p[2];
  document.getElementById("desc").textContent=p[3];
  document.getElementById("action").textContent=p[4];
  document.getElementById("range").textContent=`${p[0]}–${p[1]}`;
  document.getElementById("remain").textContent=
    rh?`还有 ${rh} 小时 ${rm} 分钟切换`:`还有 ${rm} 分钟切换`;

  const next=plan[(idx+1)%plan.length];
  document.getElementById("nextTask").textContent=next[2];
  document.getElementById("nextTime").textContent=
    idx===plan.length-1?`明天 ${next[0]}`:`${next[0]} 开始`;

  const pct=(total/1440)*100;
  document.getElementById("dayPercent").textContent=Math.floor(pct)+"%";
  document.getElementById("dayBar").style.width=pct+"%";

  const body=document.body;
  body.classList.remove("morning","evening","night");
  if(h>=6&&h<11){body.classList.add("morning");document.getElementById("phaseTag").textContent="早晨";}
  else if(h>=18&&h<22){body.classList.add("evening");document.getElementById("phaseTag").textContent="傍晚 / 晚上";}
  else if(h>=22||h<6){body.classList.add("night");document.getElementById("phaseTag").textContent="夜间";}
  else{document.getElementById("phaseTag").textContent="白天";}

  renderTimeline(idx);
}

update();
setInterval(update,1000);
</script>
</body>
</html>
